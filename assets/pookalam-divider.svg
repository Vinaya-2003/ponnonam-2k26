<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" fill="none" role="img" aria-hidden="true">
  <!-- Left arm -->
  <line x1="0" y1="45" x2="490" y2="45" stroke="#D4A843" stroke-width="0.7" opacity="0.35"/>
  <circle cx="490" cy="45" r="2.5" fill="#D4A843" opacity="0.55"/>
  <circle cx="470" cy="45" r="2"   fill="#D4A843" opacity="0.4"/>
  <circle cx="450" cy="45" r="1.5" fill="#D4A843" opacity="0.28"/>

  <!-- Left small bud -->
  <g transform="translate(516,45)">
    <ellipse cx="0" cy="-9" rx="4.5" ry="9" fill="#D4A843" opacity="0.7"/>
    <ellipse cx="0" cy="-9" rx="4.5" ry="9" fill="#E07B20" opacity="0.6" transform="rotate(60)"/>
    <ellipse cx="0" cy="-9" rx="4.5" ry="9" fill="#F0CC50" opacity="0.65" transform="rotate(120)"/>
    <ellipse cx="0" cy="-9" rx="4.5" ry="9" fill="#D4A843" opacity="0.7" transform="rotate(180)"/>
    <ellipse cx="0" cy="-9" rx="4.5" ry="9" fill="#E07B20" opacity="0.6" transform="rotate(240)"/>
    <ellipse cx="0" cy="-9" rx="4.5" ry="9" fill="#F0CC50" opacity="0.65" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="5" fill="#F5D060" opacity="0.9"/>
    <circle cx="0" cy="0" r="2.5" fill="#D4A843"/>
  </g>

  <!-- Left medium bud -->
  <g transform="translate(549,45)">
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#E07B20" opacity="0.75" transform="rotate(0)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#D4A843" opacity="0.8" transform="rotate(45)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#F0CC50" opacity="0.75" transform="rotate(90)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#E07B20" opacity="0.8" transform="rotate(135)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#D4A843" opacity="0.75" transform="rotate(180)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#F0CC50" opacity="0.8" transform="rotate(225)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#E07B20" opacity="0.75" transform="rotate(270)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#D4A843" opacity="0.8" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="7" fill="#F5D060" opacity="0.9"/>
    <circle cx="0" cy="0" r="3.5" fill="#C9962C"/>
  </g>

  <!-- CENTRE POOKALAM -->
  <g transform="translate(600,45)">
    <!-- Outermost ring dots -->
    <circle cx="0" cy="-38" r="3" fill="#E07B20" opacity="0.55"/>
    <circle cx="0" cy="-38" r="3" fill="#E07B20" opacity="0.55" transform="rotate(45)"/>
    <circle cx="0" cy="-38" r="3" fill="#E07B20" opacity="0.55" transform="rotate(90)"/>
    <circle cx="0" cy="-38" r="3" fill="#E07B20" opacity="0.55" transform="rotate(135)"/>
    <circle cx="0" cy="-38" r="3" fill="#E07B20" opacity="0.55" transform="rotate(180)"/>
    <circle cx="0" cy="-38" r="3" fill="#E07B20" opacity="0.55" transform="rotate(225)"/>
    <circle cx="0" cy="-38" r="3" fill="#E07B20" opacity="0.55" transform="rotate(270)"/>
    <circle cx="0" cy="-38" r="3" fill="#E07B20" opacity="0.55" transform="rotate(315)"/>
    <!-- Outer petals -->
    <ellipse cx="0" cy="-26" rx="7" ry="14" fill="#D4A843" opacity="0.85" transform="rotate(0)"/>
    <ellipse cx="0" cy="-26" rx="7" ry="14" fill="#E07B20" opacity="0.8"  transform="rotate(45)"/>
    <ellipse cx="0" cy="-26" rx="7" ry="14" fill="#F0CC50" opacity="0.85" transform="rotate(90)"/>
    <ellipse cx="0" cy="-26" rx="7" ry="14" fill="#E07B20" opacity="0.8"  transform="rotate(135)"/>
    <ellipse cx="0" cy="-26" rx="7" ry="14" fill="#D4A843" opacity="0.85" transform="rotate(180)"/>
    <ellipse cx="0" cy="-26" rx="7" ry="14" fill="#E07B20" opacity="0.8"  transform="rotate(225)"/>
    <ellipse cx="0" cy="-26" rx="7" ry="14" fill="#F0CC50" opacity="0.85" transform="rotate(270)"/>
    <ellipse cx="0" cy="-26" rx="7" ry="14" fill="#E07B20" opacity="0.8"  transform="rotate(315)"/>
    <!-- Inner petals offset 22.5 deg -->
    <ellipse cx="0" cy="-17" rx="5" ry="10" fill="#F0CC50" opacity="0.9" transform="rotate(22.5)"/>
    <ellipse cx="0" cy="-17" rx="5" ry="10" fill="#D4A843" opacity="0.9" transform="rotate(67.5)"/>
    <ellipse cx="0" cy="-17" rx="5" ry="10" fill="#F0CC50" opacity="0.9" transform="rotate(112.5)"/>
    <ellipse cx="0" cy="-17" rx="5" ry="10" fill="#D4A843" opacity="0.9" transform="rotate(157.5)"/>
    <ellipse cx="0" cy="-17" rx="5" ry="10" fill="#F0CC50" opacity="0.9" transform="rotate(202.5)"/>
    <ellipse cx="0" cy="-17" rx="5" ry="10" fill="#D4A843" opacity="0.9" transform="rotate(247.5)"/>
    <ellipse cx="0" cy="-17" rx="5" ry="10" fill="#F0CC50" opacity="0.9" transform="rotate(292.5)"/>
    <ellipse cx="0" cy="-17" rx="5" ry="10" fill="#D4A843" opacity="0.9" transform="rotate(337.5)"/>
    <!-- Centre circles -->
    <circle cx="0" cy="0" r="11" fill="#F5D060" opacity="0.95"/>
    <circle cx="0" cy="0" r="6"  fill="#D4A843"/>
    <circle cx="0" cy="0" r="3"  fill="#7A0A1E"/>
  </g>

  <!-- Right medium bud -->
  <g transform="translate(651,45)">
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#E07B20" opacity="0.75" transform="rotate(0)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#D4A843" opacity="0.8"  transform="rotate(45)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#F0CC50" opacity="0.75" transform="rotate(90)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#E07B20" opacity="0.8"  transform="rotate(135)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#D4A843" opacity="0.75" transform="rotate(180)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#F0CC50" opacity="0.8"  transform="rotate(225)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#E07B20" opacity="0.75" transform="rotate(270)"/>
    <ellipse cx="0" cy="-13" rx="6" ry="12" fill="#D4A843" opacity="0.8"  transform="rotate(315)"/>
    <circle cx="0" cy="0" r="7" fill="#F5D060" opacity="0.9"/>
    <circle cx="0" cy="0" r="3.5" fill="#C9962C"/>
  </g>

  <!-- Right small bud -->
  <g transform="translate(684,45)">
    <ellipse cx="0" cy="-9" rx="4.5" ry="9" fill="#D4A843" opacity="0.7"/>
    <ellipse cx="0" cy="-9" rx="4.5" ry="9" fill="#E07B20" opacity="0.6"  transform="rotate(60)"/>
    <ellipse cx="0" cy="-9" rx="4.5" ry="9" fill="#F0CC50" opacity="0.65" transform="rotate(120)"/>
    <ellipse cx="0" cy="-9" rx="4.5" ry="9" fill="#D4A843" opacity="0.7"  transform="rotate(180)"/>
    <ellipse cx="0" cy="-9" rx="4.5" ry="9" fill="#E07B20" opacity="0.6"  transform="rotate(240)"/>
    <ellipse cx="0" cy="-9" rx="4.5" ry="9" fill="#F0CC50" opacity="0.65" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="5" fill="#F5D060" opacity="0.9"/>
    <circle cx="0" cy="0" r="2.5" fill="#D4A843"/>
  </g>

  <!-- Right arm -->
  <circle cx="710" cy="45" r="2.5" fill="#D4A843" opacity="0.55"/>
  <circle cx="730" cy="45" r="2"   fill="#D4A843" opacity="0.4"/>
  <circle cx="750" cy="45" r="1.5" fill="#D4A843" opacity="0.28"/>
  <line x1="710" y1="45" x2="1200" y2="45" stroke="#D4A843" stroke-width="0.7" opacity="0.35"/>
</svg>
